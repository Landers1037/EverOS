[package]
name = "ever-os"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.7", features = ["ws", "macros"] }
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
hex = "0.4"
http-range-header = "0.4"
jsonwebtoken = "9"
mime_guess = "2"
argon2 = "0.5"
flate2 = "1"
http-body-util = "0.1"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sled = "0.34"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "time", "uuid", "json"] }
sysinfo = "0.30"
thiserror = "1"
time = { version = "0.3", features = ["serde", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
tower = "0.5"
